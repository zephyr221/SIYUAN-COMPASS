[project]
name = "siyuan-compass-backend"
version = "0.1.0"
description = "FastAPI backend for 交小航——你的AI生涯伙伴."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.0",
  "Flask>=3.0.0",
  "python-multipart>=0.0.9"
]

[tool.pytest.ini_options]
pythonpath = ["."]

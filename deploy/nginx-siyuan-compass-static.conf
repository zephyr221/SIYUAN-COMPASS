server {
    listen 127.0.0.1:18121;
    server_name _;
    root /opt/siyuan-compass/frontend/dist;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

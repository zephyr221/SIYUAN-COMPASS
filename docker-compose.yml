name: siyuan-compass

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siyuan_compass}
      POSTGRES_USER: ${POSTGRES_USER:-siyuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-siyuan} -d ${POSTGRES_DB:-siyuan_compass}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: siyuan-compass-backend:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://models.sjtu.edu.cn/api/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-600}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-disabled}
      SPEECH_XFYUN_APP_ID: ${SPEECH_XFYUN_APP_ID:-}
      SPEECH_XFYUN_API_KEY: ${SPEECH_XFYUN_API_KEY:-}
      SPEECH_XFYUN_API_SECRET: ${SPEECH_XFYUN_API_SECRET:-}
      SPEECH_XFYUN_BASE_URL: ${SPEECH_XFYUN_BASE_URL:-https://office-api-ist-dx.iflyaisol.com}
      SPEECH_XFYUN_LANGUAGE: ${SPEECH_XFYUN_LANGUAGE:-autodialect}
      SPEECH_XFYUN_DOMAIN: ${SPEECH_XFYUN_DOMAIN:-edu}
      SPEECH_XFYUN_POLL_INTERVAL_SECONDS: ${SPEECH_XFYUN_POLL_INTERVAL_SECONDS:-1.5}
      SPEECH_XFYUN_POLL_TIMEOUT_SECONDS: ${SPEECH_XFYUN_POLL_TIMEOUT_SECONDS:-120}
      SPEECH_TIMEOUT_SECONDS: ${SPEECH_TIMEOUT_SECONDS:-30}
      SPEECH_MAX_FILE_MB: ${SPEECH_MAX_FILE_MB:-10}
      SPEECH_DAILY_LIMIT: ${SPEECH_DAILY_LIMIT:-0}
      SPEECH_QUOTA_TIMEZONE: ${SPEECH_QUOTA_TIMEZONE:-Asia/Shanghai}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TOKEN_HOURS: ${AUTH_TOKEN_HOURS:-72}
      ASSESSMENT_SUBMISSION_MAINTENANCE: ${ASSESSMENT_SUBMISSION_MAINTENANCE:-false}
      ASSESSMENT_SUBMISSION_MAINTENANCE_MESSAGE: ${ASSESSMENT_SUBMISSION_MAINTENANCE_MESSAGE:-报告生成服务正在维护，现暂停新提交和报告生成。请勿重复提交、清理浏览器缓存或更换设备，以免丢失本机已填写内容。请保留当前浏览器；恢复后请先查看结果，我们会另行通知需要补充信息的同学。}
      REPORT_GENERATION_DAILY_LIMIT: ${REPORT_GENERATION_DAILY_LIMIT:-0}
      REPORT_GENERATION_QUOTA_TIMEZONE: ${REPORT_GENERATION_QUOTA_TIMEZONE:-Asia/Shanghai}
      GENERATION_MAX_CONCURRENCY: ${GENERATION_MAX_CONCURRENCY:-4}
      GENERATION_JOB_LEASE_SECONDS: ${GENERATION_JOB_LEASE_SECONDS:-300}
      GENERATION_JOB_HEARTBEAT_SECONDS: ${GENERATION_JOB_HEARTBEAT_SECONDS:-30}
      GENERATION_JOB_RETENTION_DAYS: ${GENERATION_JOB_RETENTION_DAYS:-30}
      ASSESSMENT_DRAFT_RETENTION_DAYS: ${ASSESSMENT_DRAFT_RETENTION_DAYS:-30}
      ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-180}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-系统管理员}
      DATABASE_URL: postgresql://${POSTGRES_USER:-siyuan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-siyuan_compass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: siyuan-compass-frontend:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_BASE_PATH: /
        VITE_ENABLE_LOCAL_AUTH: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres-data:
